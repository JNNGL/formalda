spring.application.name=formalda
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework

formalda.base-url=${FORMALDA_BASE_URL:http://localhost:8080}
formalda.mail-from=${FORMALDA_MAIL_FROM:noreply@formalda.local}
formalda.verification.ttl=PT10M
formalda.verification.max-attempts=5
formalda.verification.resend-cooldown=PT60S
formalda.bootstrap-admin.email=${FORMALDA_ADMIN_EMAIL:}
formalda.bootstrap-admin.username=${FORMALDA_ADMIN_USERNAME:}
formalda.bootstrap-admin.password=${FORMALDA_ADMIN_PASSWORD:}
